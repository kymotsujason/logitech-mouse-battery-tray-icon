name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the version and whether it has a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^VERSION = "\([^"]*\)"$/\1/p' src/version.py)
          if [ -z "$version" ]; then
            echo "::error::src/version.py holds no VERSION line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /tmp/view.log 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$version already has a release, so there's nothing to publish"
          elif grep -q "release not found" /tmp/view.log; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "v$version has no release yet, so it gets built, tested, and published"
          else
            cat /tmp/view.log
            exit 1
          fi

  release:
    needs: check
    # a manual run can start from any branch, and only main publishes
    if: needs.check.outputs.released == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the unit suite on Debian 12, Ubuntu 24.04, and Arch
        run: tests/containers/runUnitTests.sh
      - name: Validate the desktop entries, udev rule, service unit, and AppStream data
        run: packaging/validate.sh
      - name: Check the icon registers with a tray that shows up late on Qt 6.4
        run: tests/live/checkLateTray.sh
      - name: Build the tarball
        run: packaging/tarball.sh
      - name: Build the .deb and .rpm
        run: packaging/build.sh
      - name: Build the Arch package
        run: packaging/buildArch.sh
      - name: Test each package in a clean container
        run: tests/containers/testPackages.sh
      - name: Upgrade a running 1.0.1 and 1.1.0 tray in a container
        run: tests/containers/testUpgrade.sh
      - name: Check the packaged service on this booted runner
        run: tests/booted/checkService.sh
      - name: Upgrade a running 1.1.0 service on this booted runner
        run: tests/booted/checkServiceUpgrade.sh
      - name: Bundle the checksummed PKGBUILD for the AUR
        run: tar -czf "dist/logitech-mouse-battery-$VERSION-aur.tar.gz" -C dist/aur PKGBUILD .SRCINFO logitech-mouse-battery.install
      - name: Write the checksums of every asset
        run: cd dist && sha256sum *.deb *.rpm *.pkg.tar.zst *.tar.gz > SHA256SUMS
      # the checksums come from this same job, so a signed record of the commit and workflow that built each asset is what lets a user check it
      - name: Attest the provenance of every asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      # GitHub ignores the publish step's --target when the tag already exists, so a tag pushed at another commit would
      # carry these assets under that commit's source, and an annotated tag's own line names the tag object, not its commit
      - name: Check that the version's tag, if one exists, points at this commit
        run: |
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" > /tmp/tag.log; then
            commit=$(awk -v peeled="refs/tags/v$VERSION^{}" '$2 == peeled { print $1 }' /tmp/tag.log)
            if [ -z "$commit" ]; then
              commit=$(awk '{ print $1 }' /tmp/tag.log)
            fi
            if [ "$commit" != "$GITHUB_SHA" ]; then
              echo "::error::v$VERSION already points at $commit, not at $GITHUB_SHA, and the release would publish under it"
              exit 1
            fi
          else
            code=$?
            if [ "$code" -ne 2 ]; then
              echo "::error::couldn't look up the v$VERSION tag"
              exit 1
            fi
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the check job's read token and the tag lookup both skip drafts, so a draft a failed run left behind is cleared here, where the token can list it
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"v$VERSION\") | \"\(.id) \(.author.login)\"" > /tmp/drafts.log
          # a release this workflow's token made names github-actions[bot] as its author, and any other draft for the tag is the owner's own,
          # which may hold notes meant for this version, so the publish stops before it deletes or publishes anything
          others=$(awk '$2 != "github-actions[bot]" { print $1 }' /tmp/drafts.log)
          if [ -n "$others" ]; then
            echo "::error::v$VERSION has draft releases this workflow didn't make ($(echo $others)), so publish or delete them by hand and run the release again"
            exit 1
          fi
          for id in $(awk '$2 == "github-actions[bot]" { print $1 }' /tmp/drafts.log); do
            echo "found a draft release for v$VERSION from an earlier run, so it's replaced"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Mouse Battery $VERSION" --notes "Install steps are in the README." dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.tar.gz dist/SHA256SUMS
