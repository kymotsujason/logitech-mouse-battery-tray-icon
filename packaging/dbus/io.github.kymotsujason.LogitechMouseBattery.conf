<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="logitech-mouse-battery">
    <allow own="io.github.kymotsujason.LogitechMouseBattery"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.kymotsujason.LogitechMouseBattery" send_interface="io.github.kymotsujason.LogitechMouseBattery1" send_member="GetState"/>
    <allow send_destination="io.github.kymotsujason.LogitechMouseBattery" send_interface="io.github.kymotsujason.LogitechMouseBattery1" send_member="ReadAll"/>
    <allow send_destination="io.github.kymotsujason.LogitechMouseBattery" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="io.github.kymotsujason.LogitechMouseBattery" send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="io.github.kymotsujason.LogitechMouseBattery" send_interface="org.freedesktop.DBus.Peer" send_member="GetMachineId"/>
  </policy>
</busconfig>
